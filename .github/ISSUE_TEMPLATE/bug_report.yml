name: Bug report
description: Report an unexpected behavior or regression.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I am reporting a reproducible bug (not a usage question).
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am using the latest available version of Merit.
          required: true
  - type: input
    id: version
    attributes:
      label: Merit version
      description: Run `uv run merit --version`.
      placeholder: e.g. 0.2.1
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Run `uv run python --version`.
      placeholder: e.g. Python 3.12.7
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.3 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: Provide the smallest code snippet or steps to reproduce.
      render: python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: shell
